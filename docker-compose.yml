version: '3.8'

services:
  autoapply:
    build: .
    container_name: autoapply-ai
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persist database and ChromaDB across container restarts
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./autoapply.db:/app/autoapply.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3